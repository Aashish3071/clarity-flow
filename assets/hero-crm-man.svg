<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" width="100%" height="100%" aria-label="Professional using Credstacks CRM on computer">
  <defs>
    <!-- Drop Shadow for floating cards -->
    <filter id="cardShadow" x="-10%" y="-10%" width="125%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- ==================== BACKGROUND SHAPES ==================== -->
  <!-- Soft background circular backdrop -->
  <circle cx="330" cy="220" r="175" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
  <circle cx="330" cy="220" r="130" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ==================== OFFICE PLANT (LEFT) ==================== -->
  <g id="pottedPlant" transform="translate(20, 200)">
    <!-- Terracotta / Slate Pot -->
    <path d="M 38 180 L 30 230 Q 30 234 34 234 L 56 234 Q 60 234 60 230 L 52 180 Z" fill="#94A3B8"/>
    <ellipse cx="45" cy="180" rx="7" ry="2.5" fill="#64748B"/>
    <!-- Plant Stem and Foliage -->
    <path d="M 45 180 Q 42 140 30 110" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <path d="M 45 180 Q 55 130 68 90" fill="none" stroke="#059669" stroke-width="3" stroke-linecap="round"/>
    <path d="M 45 180 Q 45 110 45 70" fill="none" stroke="#10B981" stroke-width="3.5" stroke-linecap="round"/>
    <!-- Leaves -->
    <path d="M 45 70 Q 35 45 45 35 Q 55 45 45 70 Z" fill="#10B981"/>
    <path d="M 30 110 Q 15 95 20 80 Q 35 90 30 110 Z" fill="#059669"/>
    <path d="M 68 90 Q 85 75 80 60 Q 65 70 68 90 Z" fill="#047857"/>
    <path d="M 40 140 Q 20 130 22 115 Q 38 120 40 140 Z" fill="#10B981"/>
    <path d="M 52 135 Q 70 125 72 110 Q 55 115 52 135 Z" fill="#059669"/>
  </g>

  <!-- ==================== DESK & ENVIRONMENT ==================== -->
  <!-- Desk Surface -->
  <rect x="110" y="275" width="370" height="14" rx="4" fill="#0F172A"/>
  <rect x="110" y="287" width="370" height="4" fill="#1E293B"/>
  <!-- Desk Legs -->
  <line x1="140" y1="289" x2="140" y2="430" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
  <line x1="450" y1="289" x2="450" y2="430" stroke="#CBD5E1" stroke-width="6" stroke-linecap="round"/>
  <!-- Floor Shadow -->
  <ellipse cx="320" cy="428" rx="210" ry="8" fill="#E2E8F0"/>

  <!-- Coffee Mug on Desk -->
  <rect x="135" y="257" width="16" height="18" rx="3" fill="#2563EB"/>
  <path d="M 151 262 Q 157 266 151 270" fill="none" stroke="#2563EB" stroke-width="2"/>

  <!-- Slim Keyboard & Mouse on Desk -->
  <rect x="180" y="268" width="85" height="5" rx="2" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>
  <rect x="275" y="268" width="14" height="5" rx="2.5" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="1"/>

  <!-- ==================== COMPUTER MONITOR ==================== -->
  <!-- Monitor Stand -->
  <path d="M 215 240 L 215 275 L 200 275 L 235 275 L 220 275 L 220 240 Z" fill="#64748B"/>
  <!-- Monitor Frame -->
  <rect x="110" y="80" width="220" height="160" rx="8" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <circle cx="220" cy="233" r="2.5" fill="#64748B"/>

  <!-- ==================== CRM SCREEN DISPLAY ==================== -->
  <!-- Screen Canvas -->
  <rect x="116" y="86" width="208" height="142" rx="4" fill="#FFFFFF"/>

  <!-- CRM App Header Bar -->
  <rect x="116" y="86" width="208" height="20" rx="4" fill="#0F172A"/>
  <!-- Window dots -->
  <circle cx="125" cy="96" r="2.5" fill="#EF4444"/>
  <circle cx="132" cy="96" r="2.5" fill="#F59E0B"/>
  <circle cx="139" cy="96" r="2.5" fill="#10B981"/>
  <!-- Header Title -->
  <text x="148" y="99" fill="#FFFFFF" font-family="Inter, -apple-system, sans-serif" font-size="7.5" font-weight="700">Credstacks CRM</text>
  <!-- Mini Search Pill -->
  <rect x="235" y="90" width="82" height="12" rx="3" fill="#1E293B"/>
  <text x="242" y="99" fill="#94A3B8" font-family="Inter, -apple-system, sans-serif" font-size="6.5">Search pipeline...</text>

  <!-- Left Mini Sidebar -->
  <rect x="116" y="106" width="30" height="122" fill="#F8FAFC"/>
  <line x1="146" y1="106" x2="146" y2="228" stroke="#E2E8F0" stroke-width="1"/>
  <!-- Sidebar Menu Blocks -->
  <rect x="121" y="112" width="20" height="6" rx="2" fill="#2563EB"/>
  <rect x="121" y="122" width="20" height="4" rx="1.5" fill="#CBD5E1"/>
  <rect x="121" y="130" width="20" height="4" rx="1.5" fill="#CBD5E1"/>
  <rect x="121" y="138" width="20" height="4" rx="1.5" fill="#CBD5E1"/>
  <rect x="121" y="146" width="20" height="4" rx="1.5" fill="#CBD5E1"/>

  <!-- Main CRM Board -->
  <text x="152" y="116" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="7.5" font-weight="700">Deals Pipeline</text>
  <text x="316" y="116" text-anchor="end" fill="#059669" font-family="Inter, -apple-system, sans-serif" font-size="7" font-weight="700">$184,200</text>

  <!-- Kanban Column 1: Qualified -->
  <rect x="150" y="121" width="53" height="102" rx="3" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="154" y="129" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="600">Qualified (4)</text>
  <!-- Card 1 -->
  <rect x="153" y="133" width="47" height="24" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="156" y="141" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="5.5" font-weight="700">Acme Corp</text>
  <text x="156" y="151" fill="#2563EB" font-family="Inter, -apple-system, sans-serif" font-size="5.5" font-weight="600">$14,500</text>
  <!-- Card 2 -->
  <rect x="153" y="160" width="47" height="24" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="0.8"/>
  <text x="156" y="168" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="5.5" font-weight="700">Nova Labs</text>
  <text x="156" y="178" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="5.5" font-weight="600">$8,200</text>

  <!-- Kanban Column 2: Proposal Sent (Active) -->
  <rect x="207" y="121" width="55" height="102" rx="3" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="0.8"/>
  <text x="211" y="129" fill="#1D4ED8" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="700">Proposal (2)</text>
  <!-- Active Highlighted Card -->
  <rect x="210" y="133" width="49" height="32" rx="2" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.2"/>
  <text x="213" y="142" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="700">Apex Industrial</text>
  <text x="213" y="152" fill="#059669" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="700">$48,500</text>
  <!-- Progress meter -->
  <rect x="213" y="157" width="43" height="3" rx="1.5" fill="#E2E8F0"/>
  <rect x="213" y="157" width="34" height="3" rx="1.5" fill="#2563EB"/>

  <!-- Kanban Column 3: Closed / Won -->
  <rect x="266" y="121" width="53" height="102" rx="3" fill="#F0FDF4" stroke="#DCFCE7" stroke-width="0.8"/>
  <text x="270" y="129" fill="#15803D" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="700">Won (8)</text>
  <!-- Card Won -->
  <rect x="269" y="133" width="47" height="26" rx="2" fill="#FFFFFF" stroke="#86EFAC" stroke-width="0.8"/>
  <text x="272" y="141" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="5.5" font-weight="700">BlueSky Co</text>
  <text x="272" y="152" fill="#059669" font-family="Inter, -apple-system, sans-serif" font-size="6" font-weight="700">$32,000 ✓</text>

  <!-- ==================== OFFICE CHAIR ==================== -->
  <g id="ergonomicChair">
    <!-- Backrest -->
    <path d="M 405 130 Q 425 130 425 155 L 420 280 Q 420 295 400 295 L 390 295 Q 375 295 375 280 L 375 155 Q 375 130 405 130 Z" fill="#1E293B"/>
    <!-- Mesh Texture Lines -->
    <line x1="382" y1="160" x2="418" y2="160" stroke="#334155" stroke-width="1.5"/>
    <line x1="382" y1="190" x2="418" y2="190" stroke="#334155" stroke-width="1.5"/>
    <line x1="382" y1="220" x2="418" y2="220" stroke="#334155" stroke-width="1.5"/>
    <line x1="382" y1="250" x2="418" y2="250" stroke="#334155" stroke-width="1.5"/>
    <!-- Seat Cushion -->
    <rect x="345" y="285" width="85" height="16" rx="6" fill="#0F172A"/>
    <!-- Armrest -->
    <path d="M 335 255 L 375 255 L 375 285" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Chair Base & Cylinder -->
    <rect x="382" y="301" width="12" height="60" fill="#64748B"/>
    <path d="M 388 361 L 340 405 M 388 361 L 436 405 M 388 361 L 388 410" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <!-- Wheels -->
    <circle cx="338" cy="408" r="4" fill="#0F172A"/>
    <circle cx="438" cy="408" r="4" fill="#0F172A"/>
    <circle cx="388" cy="413" r="4" fill="#0F172A"/>
  </g>

  <!-- ==================== MAN / CHARACTER ==================== -->
  <g id="professionalMan">
    <!-- Legs / Pants -->
    <path d="M 365 295 L 345 365 L 310 365 L 310 405" fill="none" stroke="#0F172A" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Shoes -->
    <path d="M 300 405 L 330 405 Q 335 405 335 412 L 295 412 Z" fill="#475569"/>

    <!-- Torso (Navy / Smart Casual Shirt) -->
    <path d="M 365 190 Q 395 185 410 200 L 405 295 L 350 295 L 345 220 Z" fill="#1E293B"/>
    <!-- Shirt Collar Details -->
    <path d="M 345 190 L 360 208 L 350 215 Z" fill="#2563EB"/>
    <path d="M 365 190 L 350 208 L 360 215 Z" fill="#1D4ED8"/>

    <!-- Left Arm & Hand (Resting on Keyboard) -->
    <path d="M 365 205 Q 330 235 250 268" fill="none" stroke="#1E293B" stroke-width="15" stroke-linecap="round"/>
    <!-- Hand -->
    <ellipse cx="245" cy="269" rx="6" ry="5" fill="#FBBF24"/>

    <!-- Right Arm & Hand (On Mouse) -->
    <path d="M 385 205 Q 345 245 285 268" fill="none" stroke="#1E293B" stroke-width="14" stroke-linecap="round"/>
    <ellipse cx="282" cy="269" rx="6" ry="5" fill="#FBBF24"/>

    <!-- Neck -->
    <rect x="350" y="172" width="14" height="20" rx="4" fill="#FBBF24"/>

    <!-- Head -->
    <circle cx="355" cy="154" r="22" fill="#FBBF24"/>
    <!-- Ear -->
    <circle cx="370" cy="156" r="4.5" fill="#F59E0B"/>
    <!-- Modern Dark Hair -->
    <path d="M 334 150 Q 334 130 355 130 Q 378 130 378 148 Q 378 160 374 164 Q 370 148 355 146 Q 340 146 334 150 Z" fill="#0F172A"/>
    <!-- Eyeglasses / Face Profile -->
    <rect x="336" y="148" width="16" height="8" rx="2" fill="none" stroke="#0F172A" stroke-width="2"/>
    <line x1="352" y1="152" x2="370" y2="152" stroke="#0F172A" stroke-width="1.8"/>
    <!-- Nose & Mouth subtle profile -->
    <path d="M 333 154 L 330 159 L 334 160" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M 334 167 Q 340 169 344 166" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- ==================== FLOATING CRM METRIC CARDS ==================== -->
  <!-- Top-Right Floating Badge: Deal Won Notification -->
  <g filter="url(#cardShadow)" transform="translate(365, 35)">
    <rect x="0" y="0" width="195" height="60" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="20" cy="22" r="5" fill="#10B981"/>
    <text x="32" y="24" fill="#059669" font-family="Inter, -apple-system, sans-serif" font-size="10" font-weight="700">Deal Closed Won!</text>
    <text x="32" y="42" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="800">Apex MFG • $48,500</text>
    <text x="180" y="24" text-anchor="end" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="500">Just now</text>
  </g>

  <!-- Bottom-Left Floating Badge: Pipeline Health -->
  <g filter="url(#cardShadow)" transform="translate(25, 295)">
    <rect x="0" y="0" width="165" height="52" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="14" y="20" fill="#64748B" font-family="Inter, -apple-system, sans-serif" font-size="9.5" font-weight="600">Monthly Revenue</text>
    <text x="14" y="38" fill="#0F172A" font-family="Inter, -apple-system, sans-serif" font-size="13" font-weight="800">$184,200</text>
    <rect x="105" y="24" width="48" height="18" rx="4" fill="#EFF6FF" stroke="#DBEAFE" stroke-width="1"/>
    <text x="129" y="36" text-anchor="middle" fill="#2563EB" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="700">+28.4%</text>
  </g>
</svg>
